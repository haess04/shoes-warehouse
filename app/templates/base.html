<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magazynier</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-logo-wrap"><img src="/static/favicon.svg" alt="Magazynier" class="brand-logo" /></span>
        <span class="brand-copy"><strong>MAGAZYNIER</strong><small>panel magazynowy</small></span>
      </a>
      <nav class="topbar-nav">
        <a href="/" class="{% if request.path == '/' or request.path.startswith('/pallets') or request.path.startswith('/shoes') %}active{% endif %}"><span>▦</span> Palety</a>
      </nav>
    </header>

    <main class="container">{% block content %}{% endblock %}</main>
  </body>
  </html>
