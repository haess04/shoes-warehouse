{# Local inline icons: no web fonts, CDN or external requests. #}
{% macro icon(name, extra_class='') -%}
<svg class="icon {{ extra_class }}" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {% if name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>
  {% elif name == 'add' %}<path d="M12 5v14M5 12h14"/>
  {% elif name == 'warehouse' %}<path d="m3 8 9-5 9 5v12H3ZM7 20V10h10v10M7 14h10M7 17h10"/>
  {% elif name == 'box' %}<path d="m3 7 9-4 9 4v10l-9 4-9-4ZM3 7l9 5 9-5M12 12v9M7 5l10 5"/>
  {% elif name == 'chart' %}<path d="M4 4v16h16M8 15v-4M13 15V7M18 15v-6"/>
  {% elif name == 'trend' %}<path d="m4 17 6-6 4 3 6-9M14 5h6v6"/>
  {% elif name == 'wallet' %}<path d="M20 8V5H6a3 3 0 0 0 0 6h14v9H6a3 3 0 0 1-3-3V8M20 11h-6v5h6"/><path d="M16 13.5h.01"/>
  {% elif name == 'percent' %}<path d="m6 19 12-14"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>
  {% elif name == 'clock' %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {% elif name == 'alert' %}<path d="m12 3 10 18H2ZM12 9v4M12 17h.01"/>
  {% elif name == 'database' %}<ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 4 16 4 16 0V5M4 12v7c0 4 16 4 16 0v-7"/>
  {% elif name == 'chevron' %}<path d="m9 5 7 7-7 7"/>
  {% elif name == 'image' %}<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m3 17 5-5 4 4 4-7 5 8"/>
  {% elif name == 'check' %}<path d="m5 12 4 4L19 6"/>
  {% elif name == 'delete' %}<path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v6M14 10v6"/>
  {% elif name == 'edit' %}<path d="m15 4 5 5M4 20l5-1L21 7l-5-5L4 14ZM4 20l1-6"/>
  {% elif name == 'sync' %}<path d="M20 7a8 8 0 0 0-14-1L3 9M3 4v5h5M4 17a8 8 0 0 0 14 1l3-3M16 15h5v5"/>
  {% elif name == 'back' %}<path d="m10 5-7 7 7 7M3 12h18"/>
  {% elif name == 'more' %}<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>
  {% elif name == 'close' %}<path d="m6 6 12 12M18 6 6 18"/>
  {% endif %}
</svg>
{%- endmacro %}
